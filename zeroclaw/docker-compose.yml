services:
  zeroclaw:
    container_name: ${COMPOSE_PROJECT_NAME}-gw
    hostname: zeroClaw-gw
    image: localhost/zeroclaw:${ZEROCLAW_VER:-latest}
    build:
      context: ./build/
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
        EXTRA_PKGS: ${EXTRA_PKGS:-}
        ZEROCLAW_VER: ${ZEROCLAW_VER:-}
        ZEROCLAW_UID: ${ZEROCLAW_UID:-1000}
        ZEROCLAW_GID: ${ZEROCLAW_GID:-1000}
    restart: unless-stopped
    user: "${ZEROCLAW_UID:-1000}"
    environment:
      - ZEROCLAW_gateway__host=0.0.0.0
      - ZEROCLAW_gateway__port=42617
      - ZEROCLAW_gateway__allow_public_bind=true
    env_file:
      - app.env
    volumes:
      - zeroclaw-data:/zeroclaw-data
    ports:
      - "${ZEROCLAW_PORT:-127.0.0.1:42617}:42617"
    healthcheck:
      test: ["CMD", "zeroclaw", "status", "--format=exit-code"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  zeroclaw-data:
