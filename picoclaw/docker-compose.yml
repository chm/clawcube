services:
  picoclaw:
    container_name: picoclaw-launcher
    image: localhost/picoclaw
    build:
      context: ./build/
      args:
        EXTRA_PKGS: ${EXTRA_PKGS}
    restart: unless-stopped
    environment:
      - PICOCLAW_GATEWAY_HOST=0.0.0.0
    ports:
      - "${PICOCLAW_WEB_PORT}:18800"
      - "${PICOCLAW_GW_PORT}:18790"
    volumes:
      - home:/root

volumes:
  home:
