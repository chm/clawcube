services:
  picoclaw:
    container_name: ${COMPOSE_PROJECT_NAME}-gw
    hostname: picoClaw-gw
    image: localhost/picoclaw
    build:
      context: ./build/
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
        EXTRA_PKGS: ${EXTRA_PKGS:-}
    restart: unless-stopped
    environment:
      - PICOCLAW_GATEWAY_HOST=0.0.0.0
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PICOCLAW_WEB_PORT}:18800"
      #- "${PICOCLAW_GW_PORT}:18790"
    volumes:
      - home:/home/claw
    healthcheck:
      # Aligned with upstream Dockerfile.launcher
      # https://github.com/sipeed/picoclaw/blob/main/docker/Dockerfile.launcher
      test: ["CMD-SHELL", "wget -q --spider http://localhost:18790/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  home:
