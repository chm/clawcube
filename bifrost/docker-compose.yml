services:
  bifrost:
    container_name: bifrost
    image: maximhq/bifrost:${BIFROST_VER}
    restart: unless-stopped
    ports:
      - "${BIFROST_PORT:-127.0.0.1:8080}:8080"
    environment:
      APP_PORT: "8080"
      APP_HOST: "0.0.0.0"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_STYLE: "${LOG_STYLE:-json}"
    env_file:
      - app.env
    volumes:
      - data:/app/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  data:
    name: bifrost_data
