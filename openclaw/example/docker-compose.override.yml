name: clawcube

x-volumes: &claw-volumes
  - ../../data/openclaw/home:/home/claw
  - ../../data/openclaw/log:/tmp/openclaw

services:
  gateway:
    #network_mode: host
    #ports: !reset []
    volumes: *claw-volumes

  cli:
    #network_mode: host
    volumes: *claw-volumes

  tailscale:
    image: docker.io/tailscale/tailscale:stable
    network_mode: "service:gateway"
    environment:
      - TS_AUTHKEY=
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ../../data/openclaw/tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped
