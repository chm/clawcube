services:
  gateway:
    container_name: ${COMPOSE_PROJECT_NAME}-gw
    image: localhost/clawcube:${OPENCLAW_VER}
    build:
      context: ./build/
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
        EXTRA_PKGS: ${EXTRA_PKGS}
        OPENCLAW_VER: ${OPENCLAW_VER}
    environment:
      HOME: /home/claw
      TERM: xterm-256color
      TZ: ${OPENCLAW_TZ:-UTC}
    env_file:
      - .env.local
    hostname: clawCube-gw
    volumes:
      - home:/home/claw
      - log:/tmp/openclaw
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      #- "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command: [
      "node", "openclaw.mjs", "gateway",
      #"--bind", "${OPENCLAW_GATEWAY_BIND:-lan}",
      "--port", "18789",
    ]

  cli:
    image: localhost/clawcube:${OPENCLAW_VER}
    network_mode: "service:gateway"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/claw
      TERM: xterm-256color
      BROWSER: echo
      TZ: ${OPENCLAW_TZ:-UTC}
    env_file:
      - .env.local
    volumes:
      - home:/home/claw
      - log:/tmp/openclaw
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "openclaw.mjs"]
    profiles:
      - cli

volumes:
  home:
  log:
